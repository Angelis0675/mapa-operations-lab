<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <base href="/" />
        <title>MAPA Operations Lab | C# + mapas interactivos</title>
        <meta
            name="description"
            content="Portafolio de ingeniería: mapa interactivo, incidentes, asignación de unidades y bitácora con C# y Blazor WebAssembly. Datos simulados, sin backend."

        <meta property="og:type" content="website" />
        <meta property="og:title" content="MAPA Operations Lab — del reporte al cierre" />

        <style>
            .boot {
                min-height: 100vh;
                display: grid;
                place-content: center;
                text-align: center;
                gap: 12px;
            }
            .boot b {
                font-size: 26px;
                letter-spacing: 3px;
                color: #63e1c4;
            }
            .boot span {
                font-size: 13px;
                color: #94a7c1;
            }
            .boot small {
                color: #7187a4;

            }

        <div id="app">
            <div class="boot">

            No se pudo completar la operación. <a href="">Recargar demo</a>
